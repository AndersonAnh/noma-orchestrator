version: '3.9'

services:
  db:
    image: postgres:latest
    container_name: noma_db
    environment:
      POSTGRES_DB: dev_noma_orchestrator
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: qwerty
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"   # локальный 5432 -> контейнерный 5432
    volumes:
      - noma_postgres_data:/var/lib/postgresql/data

  db-info-system:
    image: postgres:latest
    container_name: info_system_db
    environment:
      POSTGRES_DB: info_system_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: qwerty
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5433:5432"   # локальный 5433 -> контейнерный 5432
    volumes:
      - info_postgres_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # адреса для подключения клиентов
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_DOCKER://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_DOCKER://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  noma_postgres_data:
  info_postgres_data:
