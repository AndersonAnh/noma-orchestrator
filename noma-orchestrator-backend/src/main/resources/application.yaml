spring:
  application:
    name: noma-orchestrator
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: system-info-group-id
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
  datasource:
    driver-class-name: org.postgresql.Driver
    username: admin
    password: qwerty
    url: jdbc:postgresql://localhost:5432/dev_noma_orchestrator
    hikari:
      # Устанавливаем таймзону на уровне handshake (GUC TimeZone)
      data-source-properties:
        options: -c TimeZone=Asia/Ho_Chi_Minh
      # (необязательно) можно продублировать установку на каждый коннект
      # connectionInitSql: "SET TIME ZONE 'Asia/Ho_Chi_Minh'"
  jpa:
    properties:
      # Чтобы Hibernate/Java корректно конвертировал временные типы
      hibernate.jdbc.time_zone: Asia/Ho_Chi_Minh
  liquibase:
    database-change-log-lock-table: ${spring.application.name}_DATABASECHANGELOCK
    change-log: db.changelog/changelog-master.yaml

server:
  port: 8888

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  info:
    title: My API
    version: 1.0.0
    description: API Documentation

integration:
  retry:
    config:
      maxAttempts: 3
      initialInterval: 2000
      multiplier: 2.0
      maxInterval: 10000
      retryableExceptions:
        - java.net.SocketTimeoutException
        - org.springframework.web.client.ResourceAccessException
        - java.io.IOException
      connectTimeout: 2000
      readTimeout: 5000
  complex-check:
    complex-check-url: ${COMPLEX_CHECK_URL:http://localhost:8081/check}
  fraud:
    fraud-url: ${FRAUD_URL:http://localhost:8082/fraud/check}
  risk:
    risk-url: ${RISK_SERVICE_URL:http://localhost:8089/api/v1/risk/calculate}

security:
 jwt:
   secret: ${JWT_SECRET:dXJpX2RlX2V4ZW1wbGVfY29udGVudF9wbGFjZWhvbGRlcg==}
   expiration: 86400000

logging:
  level:
    root: INFO

management:
  server:
    port: 8088
  endpoints:
    web:
      exposure:
        include: prometheus,health,metrics,info
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: noma-orchestrator
      environment: dev