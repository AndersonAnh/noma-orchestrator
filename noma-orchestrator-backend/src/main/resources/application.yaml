spring:
  application:
    name: noma-orchestrator
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
  datasource:
    driver-class-name: org.postgresql.Driver
    username: admin
    password: qwerty
    url: jdbc:postgresql://localhost:5432/dev_noma_orchestrator
  liquibase:
    database-change-log-lock-table: ${spring.application.name}_DATABASECHANGELOCK
    change-log: db.changelog/changelog-master.yaml
server:
  port: 9999
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  info:
    title: My API
    version: 1.0.0
    description: API Documentation
integration:
  complex-check:
    complex-check-url: ${COMPLEX_CHECK_URL:http://localhost:8081/check}
  fraud:
    fraud-url: ${FRAUD_URL:http://localhost:8082/fraud/check}
logging:
  level:
    root: INFO



